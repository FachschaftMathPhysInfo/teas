name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/fachschaftmathphysinfo/teas

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "release_tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        run: |
          if [ -n "${{ steps.tags.outputs.release_tag }}" ]; then
            docker build \
              -t "${IMAGE_NAME}:${{ steps.tags.outputs.release_tag }}" \
              -t "${IMAGE_NAME}:latest" \
              .
          else
            docker build \
              -t "${IMAGE_NAME}:latest" \
              .
          fi

      - name: Push Docker image
        run: |
          if [ -n "${{ steps.tags.outputs.release_tag }}" ]; then
            docker push "${IMAGE_NAME}:${{ steps.tags.outputs.release_tag }}"
          fi

          docker push "${IMAGE_NAME}:latest"
